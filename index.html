<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>入职接待</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#1e293b; }
  .screen { height:100%; display:flex; flex-direction:column; padding:16px 16px 14px; max-width:460px; margin:0 auto; }

  /* 顶部欢迎区 */
  .hero { text-align:center; color:#fff; flex-shrink:0; }
  .hero .emoji { font-size:34px; line-height:1; animation:bounce 2.2s ease infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .hero h1 { font-size:21px; margin:6px 0 2px; font-weight:700; letter-spacing:1px; }
  .hero p { font-size:12px; opacity:.85; }

  /* 内容滚动区 */
  .content { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; margin:12px 0 14px;
    -webkit-overflow-scrolling:touch; }
  .content::-webkit-scrollbar { width:0; }

  /* 流程卡片 */
  .card { background:rgba(255,255,255,.96); border-radius:16px; padding:16px 16px;
    box-shadow:0 8px 24px rgba(0,0,0,.14); backdrop-filter:blur(10px); }
  .card h2 { font-size:15px; color:#5b3fa8; margin-bottom:14px; display:flex; align-items:center; gap:7px; font-weight:700; }
  .card h2 .ic { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex; align-items:center; justify-content:center; font-size:14px; }

  /* 步骤 */
  .steps { display:flex; flex-direction:column; }
  .step { display:flex; gap:12px; align-items:flex-start; padding-bottom:14px; }
  .step:last-child { padding-bottom:0; }
  .step .left { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
  .step .n { width:26px; height:26px; border-radius:50%;
    background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; font-weight:700;
    display:flex; align-items:center; justify-content:center; font-size:13px; z-index:1; }
  .step .line { width:2px; flex:1; background:linear-gradient(#c7b9f0,#e9e3fb); margin-top:2px; min-height:14px; }
  .step:last-child .line { display:none; }
  .step .t { font-weight:700; font-size:14px; color:#3b2d6b; margin-top:3px; }
  .step .d { font-size:12px; color:#64748b; line-height:1.5; margin-top:2px; }

  /* 底部按钮 */
  .cta { flex-shrink:0; }
  .btn { display:block; width:100%; text-align:center; text-decoration:none;
    background:linear-gradient(135deg,#f59e0b,#f97316); color:#fff; font-size:17px; font-weight:700;
    padding:15px; border-radius:14px; letter-spacing:2px;
    box-shadow:0 8px 22px rgba(249,115,22,.4); transition:transform .1s; }
  .btn:active { transform:scale(.97); }
  .btn .arrow { margin-left:6px; }
</style>
</head>
<body>
<div class="screen">
  <div class="hero">
    <div class="emoji">🎉</div>
    <h1>欢迎加入我们</h1>
    <p>入职接待中心 · 面试入职流程</p>
  </div>

  <div class="content">
    <div class="card">
      <h2><span class="ic">📋</span>面试入职流程</h2>
      <div class="steps">
        <div class="step">
          <div class="left"><div class="n">1</div><div class="line"></div></div>
          <div><div class="t">线上报到</div><div class="d">添加面试联系人，确认面试时间与会议链接</div></div>
        </div>
        <div class="step">
          <div class="left"><div class="n">2</div><div class="line"></div></div>
          <div><div class="t">线上面试</div><div class="d">视频面试，了解基本情况与岗位匹配度</div></div>
        </div>
        <div class="step">
          <div class="left"><div class="n">3</div><div class="line"></div></div>
          <div><div class="t">工作介绍</div><div class="d">介绍岗位职责、工作内容、薪资待遇及注意事项</div></div>
        </div>
        <div class="step">
          <div class="left"><div class="n">4</div><div class="line"></div></div>
          <div><div class="t">简单培训</div><div class="d">进行基础操作培训，熟悉工作流程与要求</div></div>
        </div>
        <div class="step">
          <div class="left"><div class="n">5</div></div>
          <div><div class="t">确认入职</div><div class="d">确认意向，办理相关入职手续</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="cta">
    <a class="btn" href="https://zxkf.makes.fyi/">立即进入面试<span class="arrow">→</span></a>
  </div>
</div>
</body>
</html>
